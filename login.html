<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXILIU 应急物资管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:#12161F;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{width:440px;background:#1B222D;border:1px solid #2A3440;border-radius:8px;padding:45px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.logo-title{text-align:center;margin-bottom:35px}
.logo-title h1{font-size:22px;color:#fff;margin-bottom:6px}
.logo-title p{font-size:14px;color:#999}
.form-item{margin-bottom:22px}
.form-item label{display:block;color:#ccd;margin-bottom:8px}
.form-item input{width:100%;height:46px;background:#252D3A;border:1px solid #2A3440;border-radius:6px;padding:0 15px;color:#fff}
.form-item input:focus{border-color:#409EFF}
.captcha-box{display:flex;gap:10px}
#captcha{flex:1}
#canvas{width:120px;height:46px;background:#252D3A;border-radius:6px;cursor:pointer}
.remember-forget{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.remember{color:#ccd}
.forget a{color:#999;text-decoration:none}
.login-btn{width:100%;height:46px;background:#409EFF;border:none;border-radius:6px;color:#fff;font-size:16px;cursor:pointer}
.copyright{text-align:center;margin-top:30px;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo-title">
    <h1>AXILIU 应急物资管理系统</h1>
    <p>Emergency Material GPS Management</p>
  </div>
  <form id="loginForm">
    <div class="form-item">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <div class="form-item">
      <label>验证码</label>
      <div class="captcha-box">
        <input type="text" id="captcha" placeholder="验证码" required>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    <div class="remember-forget">
      <div class="remember"><input type="checkbox" id="remember"> 记住密码</div>
      <div class="forget"><a href="javascript:alert('请联系管理员')">忘记密码</a></div>
    </div>
    <button type="submit" class="login-btn">登录系统</button>
  </form>
  <div class="copyright">© 2026 AXILIU All rights reserved.</div>
</div>
<script>
let code = "";
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width=120;canvas.height=46;
function createCode(){
  let s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";code="";
  ctx.fillStyle="#252D3A";ctx.fillRect(0,0,120,46);
  for(let i=0;i<4;i++){
    let c=s[Math.floor(Math.random()*s.length)];code+=c;
    ctx.font="bold 26px Arial";
    ctx.fillStyle=`rgb(${Math.random()*155+100},${Math.random()*155+100},${Math.random()*155+100})`;
    ctx.save();ctx.translate(25+i*20,23);ctx.rotate((Math.random()-0.5)*0.4);
    ctx.fillText(c,0,0);ctx.restore();
  }
}
createCode();canvas.onclick=createCode;
window.onload=()=>{
  let u=localStorage.getItem("username");
  let p=localStorage.getItem("password");
  if(u&&p){document.getElementById("username").value=u;document.getElementById("password").value=p;document.getElementById("remember").checked=true;}
}
const users=[
  {username:"admin",password:"123456",role:"管理员"},
  {username:"user",password:"123456",role:"操作员"}
];
document.getElementById("loginForm").onsubmit=(e)=>{
  e.preventDefault();
  let u=document.getElementById("username").value;
  let p=document.getElementById("password").value;
  let c=document.getElementById("captcha").value.toUpperCase();
  let r=document.getElementById("remember").checked;
  if(c!==code){alert("验证码错误");createCode();return;}
  let user=users.find(x=>x.username===u&&x.password===p);
  if(!user){alert("账号或密码错误");return;}
  if(r){localStorage.setItem("username",u);localStorage.setItem("password",p);}
  else{localStorage.removeItem("username");localStorage.removeItem("password");}
  sessionStorage.setItem("login","ok");
  sessionStorage.setItem("role",user.role);
  sessionStorage.setItem("username",user.username);
  alert("登录成功");
  location.href="index.html";
}
</script>
</body>
</html>
